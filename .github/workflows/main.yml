name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --icon=icon.ico OP21_pack_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OP21_Packer-EXE
          path: dist/*.exe
